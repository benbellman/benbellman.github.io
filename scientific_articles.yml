cc:
  title: "From Side Street to Ghetto: Understanding the Rising Levels and Changing Spatial Pattern of Segregation, 1900–1940"
  authors:
    - John R. Logan
    - Elisabeta Minca
    - me
    - Amory Kisch
  year: 2023
  published_url: https://doi.org/10.1177/15356841231188968
  journal: City & Community
  abstract: "A standard interpretation of the intensification of segregation in the early twentieth century is that residents of Northern cities reacted against a growing African American presence, using segregation as a tool of social control that was less needed in the South. Evidence from newly available data for 134 cities in 1900–1940 puts this interpretation in question in several ways. We find that segregation was already high in 1900 at the neighborhood scale. Not only was it rising, but it was changing its spatial scale as clusters of Black settlement in side streets and alleys disappeared from White districts while expanding into large Black zones. Finally, multivariate analyses show that trends were similar in the North and South, and in neither region was Black population size (i.e., “Black threat”) a significant predictor of increasing segregation. The general trends of rising segregation and increasing spatial scale became a nationwide pattern."

diss:
  title: "Tracking White Flight in Philadelphia Before World War II (Dissertation)"
  authors:
    - me
  year: 2020
  published_url: https://repository.library.brown.edu/studio/item/bdr:1129230/
  publisher: Brown Digital Repository
  abstract: "In the decades after World War II, new suburban housing developments became the ideal destination for white residents of major American cities. At the same time, the Great Migration of black migrants from the South to major industrial cities across the country began to reach a peak. Qualitative housing studies identified the trend of white flight, where white residents quickly moved away from neighborhoods with new black residents due to racist anxiety, leading to homogenous black neighborhoods within large cities. Additionally, causal statistical analysis of cities after World War II (Boustan 2010) and of neighborhoods in Northern cities between 1900 and 1930 (Shertzer and Walsh 2019) have confirmed that in-flows of black migrants induced increased rates of white out-migration. However, no study has been able to identify and analyze the actual moves made by households in urban space to evaluate the white flight hypothesis at the individual level for this historical period. This dissertation addresses this gap in the historical housing and segregation literatures with a novel application of automated record linkage using supervised machine learning. The census records of the same household heads within the city of Philadelphia 1910 and 1940 are linked, showing where households lived and moved to in the decade between censuses. Chapter 1 documents this process and shows how considering the information about other households members improves the accuracy and efficiency of the resulting links. Chapter 2 presents a detailed description of residential behavior in Philadelphia during this historical period, exposing homeownership as a critical factor in shaping racial differences in stability, and mapping how white residents tended to move to growing areas at the edges of the large city. Chapter 3 uses multivariate regression directly analyze white flight, finding that white households were more likely to leave neighborhoods with a larger proportion of black residents. Together, this research provides strong evidence supporting the existence white flight before mass suburbanization, exposes new details about the history of residential change in an important American city, and offers a new analytical paradigm for studying urban populations using historical census data."

paa:
  title: "Spatial and social contexts of mortality resulting from interactions with police (Poster)"
  authors:
    - me
    - Matthew Martinez
    - Christopher Graziul
    - John R. Logan
  year: 2017
  published_url: https://repository.library.brown.edu/studio/item/bdr:781113/
  publisher: Brown Digital Repository
  abstract: "We explored the spatial distribution of racial and ethnic groups' influence on the use of lethal force by police officers and whether police officers use lethal force more often in local areas with higher racial/ethnic diversity and segregation. Health and Mortality Poster Session Prize Winner at the 2017 Population Association of America Annual Meeting in Chicago, IL."

irsr:
  title: "Local Population Change and Variations in Racial Integration in the United States, 2000–2010"  
  authors:
    - me
    - Seth E. Spielman
    - Rachel S. Franklin
  year: 2016
  published_url: https://doi.org/10.1177/0160017616665669
  pubmed: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5922766/
  journal: International Regional Science Review
  abstract: "While population growth has been consistently tied to decreasing racial segregation at the metropolitan level in the United States, little work has been done to relate small-scale changes in population size to integration. We address this question through a novel technique that tracks population changes by race and ethnicity for comparable geographies in both 2000 and 2010. Using the Theil index, we analyze the fifty most populous metropolitan statistical areas in 2010 for changes in multigroup segregation. We classify local areas by their net population change between 2000 and 2010 using a unique unit of analysis based on aggregating census blocks. We find strong evidence that growing parts of rapidly growing metropolitan areas of the United States are crucial to understanding regional differences in segregation that have emerged in past decades. Multigroup segregation declined the most in growing parts of growing metropolitan areas. Comparatively, growing parts of shrinking or stagnant metropolitan areas were less diverse and had smaller declines in segregation. We also find that local areas with shrinking populations had disproportionately high minority representation in 2000 before population loss took place. We conclude that the regional context of population growth or decline has important consequences for the residential mixing of racial groups."

ssh:
  title: "Before <i>The Philadelphia Negro</i>: Residential Segregation in a Nineteenth-Century Northern City"
  authors:
    - John R. Logan
    - me
  year: 2016
  preprint:
  published_url: https://doi.org/10.1017/ssh.2016.27
  pubmed: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5647149/
  journal: Social Science History
  abstract: "Although some scholars treat racial residential segregation in northern cities as a twentieth-century phenomenon, recent research on New York and Chicago has shown that black-white segregation was already high and rising by 1880. We draw on data from the Philadelphia Social History Project and other new sources to study trends in this city as far back as 1850 and extending to 1900, a time when DuBois had completed his epic study of The Philadelphia Negro. Segregation of “free negroes” in Philadelphia was high even before the Civil War but did not increase as the total and black populations grew through 1900. Geocoded information from the full-count data from the 1880 Census makes it possible to map the spatial configuration of black residents in fine detail. At the scale of the street segment, segregation in that year was extraordinarily high, reflecting a micropattern in which many blacks lived in alleys and short streets. Although there was considerable class variation in the black community, higher-status black households lived in areas that were little different in racial and class composition than lower-status households."
  