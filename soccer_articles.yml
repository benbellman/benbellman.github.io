allthrows:
  title: "Throw-in it Back: Towards a manual for the most common restart"
  authors:
    - me
  year: 2026
  date: 2026-04-15
  longdate: "April 15, 2026"
  published_url: https://www.americansocceranalysis.com/home/2026/4/15/throw-in-it-back
  description: "I thought it was time to replicate and extend [Eliot's] findings with all the amazing infrastructure that ASA has built since the days of CSV files on Dropbox. In addition to models estimating throw completions and retained possession, I also analyze the goals added for possessions following throws to assess the value of throw choices. This allows me to find the MLS throw-in MVPs and offer an expanded set of (very general) rules for approaching these overlooked moments of play."
  publisher: American Soccer Analysis

